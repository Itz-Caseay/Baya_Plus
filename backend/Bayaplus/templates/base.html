<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BayaPlus{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0b0b; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        .transition-all { transition: all 0.3s ease; }
        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            color: #fbbf24;
        }
        .nav-link.active {
            color: #fbbf24;
        }
        
        /* Player styles */
        .player-progress-bar {
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .player-progress-bar:hover {
            height: 6px;
        }
        .player-progress {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .player-progress-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #fbbf24;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            left: 0%;
        }
        .player-progress-bar:hover .player-progress-dot {
            opacity: 1;
        }
        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc2626, #fbbf24);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            color: white;
        }
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
        }
        .volume-bar {
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .volume-bar:hover {
            height: 6px;
        }
        .volume-progress {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            border-radius: 2px;
            width: 70%;
        }
        .toast-container {
            max-width: 380px;
            z-index: 9999;
        }
        .toast {
            min-width: 280px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#0b0b0b] text-white font-sans min-h-screen">

    {% block content %}{% endblock %}

    <!-- Toast Container -->
    <div class="toast-container fixed top-20 right-4 z-50 space-y-2"></div>

    <script>
        // Toast function
        function showToast(message, type = 'info') {
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container fixed top-20 right-4 z-50 space-y-2';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            const colors = {
                'error': 'bg-red-600 text-white',
                'success': 'bg-green-600 text-white',
                'warning': 'bg-yellow-500 text-black',
                'info': 'bg-blue-600 text-white'
            };

            toast.className = `toast px-4 py-3 rounded-lg text-sm font-medium shadow-lg transition-all transform translate-x-full ${colors[type] || colors.info}`;
            toast.innerHTML = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.transform = 'translateX(0)';
            }, 10);

            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 4000);
        }
    </script>

</body>
</html>
