<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BayaPlus{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
    <style>
        /* Global Styles */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0b0b; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        .transition-all { transition: all 0.3s ease; }
        
        /* Player Styles */
        .player-progress-bar {
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .player-progress-bar:hover {
            height: 6px;
        }
        .player-progress {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .player-progress-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #fbbf24;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            left: 0%;
        }
        .player-progress-bar:hover .player-progress-dot {
            opacity: 1;
        }
        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc2626, #fbbf24);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            color: white;
        }
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
        }
        .play-btn-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            color: #9ca3af;
        }
        .play-btn-sm:hover {
            background: #2a2a2a;
            color: white;
        }
        .volume-bar {
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .volume-bar:hover {
            height: 6px;
        }
        .volume-progress {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            border-radius: 2px;
            width: 70%;
        }
        
        /* Nav link styles */
        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            color: #fbbf24;
        }
        .nav-link.active {
            color: #fbbf24;
        }
        
        /* Toast styles */
        .toast-container {
            max-width: 380px;
            z-index: 9999;
        }
        .toast {
            min-width: 280px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Hide player on release pages */
        .hide-player .music-player {
            display: none !important;
        }
        .hide-player .main-content {
            padding-bottom: 0 !important;
        }
        
        /* Player container */
        .music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        .main-content {
            padding-bottom: 80px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#0b0b0b] text-white font-sans min-h-screen {% if hide_player %}hide-player{% endif %}">

    <!-- Music Player -->
    <div class="music-player">
        <footer class="h-20 bg-[#0f0f0f] border-t border-[#1a1a1a] px-4 sm:px-6 flex items-center justify-between z-20 shrink-0">
            <div class="flex items-center gap-3 w-1/2 sm:w-1/4 min-w-0">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded bg-red-950 flex items-center justify-center shrink-0 overflow-hidden" id="bottom-player-cover">
                    <i class="fa-solid fa-music text-red-500"></i>
                </div>
                <div class="truncate">
                    <h4 class="text-xs font-bold truncate" id="bottom-player-title">No Track</h4>
                    <p class="text-[10px] sm:text-[11px] text-gray-500 mt-0.5 truncate" id="bottom-player-artist">-</p>
                </div>
                <button class="text-red-500 hover:text-red-400 text-xs ml-1 sm:ml-2 shrink-0" id="player-like-btn">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>

            <div class="flex flex-col items-center gap-1 w-1/2 sm:w-2/4 max-w-xl">
                <div class="flex items-center gap-3 sm:gap-4">
                    <button class="text-gray-400 hover:text-white text-xs hidden sm:block" id="player-shuffle">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button class="text-gray-400 hover:text-white text-sm" id="player-prev">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button class="play-btn" id="player-play">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button class="text-gray-400 hover:text-white text-sm" id="player-next">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <button class="text-gray-400 hover:text-white text-xs hidden sm:block" id="player-repeat">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2 w-full max-w-xs">
                    <span class="text-[10px] text-gray-500" id="player-current-time">0:00</span>
                    <div class="flex-1 player-progress-bar" id="player-progress-bar">
                        <div class="player-progress" id="player-progress"></div>
                        <div class="player-progress-dot" id="player-progress-dot"></div>
                    </div>
                    <span class="text-[10px] text-gray-500" id="player-duration">0:00</span>
                </div>
            </div>

            <div class="hidden sm:flex items-center justify-end gap-3 w-1/4">
                <button class="text-gray-400 hover:text-white text-xs" id="player-queue-btn">
                    <i class="fa-solid fa-list-ul"></i>
                    <span class="text-[10px] text-yellow-400" id="player-queue-count">0</span>
                </button>
                <div class="flex items-center gap-2">
                    <button class="text-gray-400 hover:text-white text-xs" id="player-volume-btn">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <div class="volume-bar w-16 md:w-20 relative" id="player-volume-bar">
                        <div class="volume-progress" id="player-volume-progress"></div>
                    </div>
                </div>
                <button class="text-gray-400 hover:text-white text-xs ml-1"><i class="fa-solid fa-expand"></i></button>
            </div>
        </footer>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Player JavaScript -->
    <script>
        // ============================================
        // BAYAPLUS MUSIC PLAYER - COMPLETE WORKING VERSION
        // ============================================

        // Audio Player State
        let audioInstance = null;
        let currentTrack = null;
        let isPlaying = false;
        let playId = null;
        let durationTracked = 0;
        let volume = 70;
        let isShuffled = false;
        let repeatMode = 'none';
        let queue = [];
        let currentIndex = 0;

        // ============================================
        // GET AUDIO PLAYER INSTANCE
        // ============================================
        function getAudioPlayer() {
            if (!audioInstance) {
                audioInstance = new Audio();

                audioInstance.addEventListener('error', function(e) {
                    console.error('Audio error:', e);
                    showToast('Audio playback error. Please try again.', 'error');
                });

                audioInstance.addEventListener('play', function() {
                    isPlaying = true;
                    updatePlayButtons(true);
                });

                audioInstance.addEventListener('pause', function() {
                    isPlaying = false;
                    updatePlayButtons(false);
                });

                audioInstance.addEventListener('timeupdate', function() {
                    updateProgress();
                    updatePlayTracking();
                });

                audioInstance.addEventListener('loadedmetadata', function() {
                    updateDuration();
                });

                audioInstance.addEventListener('ended', function() {
                    handleTrackEnd();
                });
            }
            return audioInstance;
        }

        // ============================================
        // PLAY TRACK FUNCTION
        // ============================================
        function playTrack(trackId, trackData = null) {
            const audio = getAudioPlayer();

            if (trackData) {
                loadTrack(trackData);
            } else {
                console.log('🔍 Fetching track info for ID:', trackId);

                const playBtn = document.getElementById('player-play');
                if (playBtn) {
                    playBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                }

                const url = `/bayaplus/api/track/${trackId}/info/`;
                console.log('📡 Fetching from:', url);

                fetch(url)
                    .then(response => {
                        console.log('📡 Response status:', response.status);
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('✅ Track data received:', data);
                        if (data.error) {
                            throw new Error(data.error);
                        }
                        loadTrack(data);
                    })
                    .catch(error => {
                        console.error('❌ Error loading track:', error);
                        showToast('Could not load track. Please try again.', 'error');

                        const playBtn = document.getElementById('player-play');
                        if (playBtn) {
                            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                        }
                    });
            }
        }

        // ============================================
        // LOAD TRACK FUNCTION
        // ============================================
        function loadTrack(track) {
            console.log('🎵 Loading track:', track.title);
            currentTrack = track;

            // Update UI
            const bottomTitle = document.getElementById('bottom-player-title');
            const bottomArtist = document.getElementById('bottom-player-artist');
            const bottomCover = document.getElementById('bottom-player-cover');

            if (bottomTitle) bottomTitle.textContent = track.title;
            if (bottomArtist) bottomArtist.textContent = track.artist;

            if (track.cover_art) {
                if (bottomCover) {
                    bottomCover.innerHTML = `<img src="${track.cover_art}" class="w-full h-full object-cover rounded">`;
                }
            } else {
                if (bottomCover) {
                    bottomCover.innerHTML = `<i class="fa-solid fa-music text-red-500"></i>`;
                }
            }

            // Load audio
            const audio = getAudioPlayer();
            const audioUrl = `/bayaplus/stream/${track.id}/`;
            console.log('🔊 Loading audio from:', audioUrl);

            audio.src = audioUrl;
            audio.load();

            // Reset progress
            const progress = document.getElementById('player-progress');
            const progressDot = document.getElementById('player-progress-dot');
            const currentTimeEl = document.getElementById('player-current-time');

            if (progress) progress.style.width = '0%';
            if (progressDot) progressDot.style.left = '0%';
            if (currentTimeEl) currentTimeEl.textContent = '0:00';

            durationTracked = 0;

            // Start play tracking
            startPlayTracking(track.id);

            // Play the audio
            audio.play().then(() => {
                console.log('▶️ Playing track:', track.title);
            }).catch(error => {
                console.error('🔊 Playback error:', error);
                showToast('Could not play this track. The audio file may be missing.', 'error');
            });
        }

        // ============================================
        // PLAY TRACKING (30-second rule)
        // ============================================
        function startPlayTracking(trackId) {
            const url = `/bayaplus/api/track/${trackId}/play/start/`;
            console.log('📡 Starting play tracking at:', url);

            fetch(url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json',
                }
            })
            .then(response => {
                console.log('📡 Play tracking response:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    playId = data.play_id;
                    durationTracked = 0;
                    console.log('✅ Play tracking started:', playId);
                }
            })
            .catch(error => {
                console.error('Error starting play tracking:', error);
            });
        }

        function updatePlayTracking() {
            if (!playId) return;

            durationTracked += 1;

            if (durationTracked % 5 === 0) {
                const url = `/bayaplus/api/track/play/update/${playId}/`;
                console.log('📡 Updating play tracking:', durationTracked, 'seconds');

                fetch(url, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        duration_played: durationTracked,
                        completed: durationTracked >= 30
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.counted_as_stream) {
                        console.log('✅ Track counted as a stream!');
                    }
                })
                .catch(error => console.error('Error updating play tracking:', error));
            }
        }

        // ============================================
        // TOGGLE PLAY/PAUSE
        // ============================================
        function togglePlay() {
            const audio = getAudioPlayer();

            if (!audio.src) {
                showToast('No track loaded. Select a song to play.', 'info');
                return;
            }

            if (isPlaying) {
                audio.pause();
            } else {
                audio.play().catch(error => {
                    console.error('Play error:', error);
                    showToast('Could not play this track.', 'error');
                });
            }
        }

        // ============================================
        // PLAY NEXT / PREVIOUS
        // ============================================
        function playNext() {
            if (queue.length === 0) {
                showToast('Queue is empty.', 'info');
                return;
            }

            if (isShuffled) {
                const randomIndex = Math.floor(Math.random() * queue.length);
                currentIndex = randomIndex;
            } else {
                currentIndex = (currentIndex + 1) % queue.length;
            }

            playTrack(queue[currentIndex].id);
        }

        function playPrevious() {
            const audio = getAudioPlayer();
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }

            if (queue.length === 0) {
                showToast('Queue is empty.', 'info');
                return;
            }

            currentIndex = (currentIndex - 1 + queue.length) % queue.length;
            playTrack(queue[currentIndex].id);
        }

        // ============================================
        // HANDLE TRACK END
        // ============================================
        function handleTrackEnd() {
            console.log('🏁 Track ended');

            if (repeatMode === 'one') {
                const audio = getAudioPlayer();
                audio.currentTime = 0;
                audio.play();
            } else {
                playNext();
            }
        }

        // ============================================
        // UPDATE UI FUNCTIONS
        // ============================================
        function updatePlayButtons(playing) {
            const playBtn = document.getElementById('player-play');
            if (playBtn) {
                playBtn.innerHTML = playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
            }
        }

        function updateProgress() {
            const audio = getAudioPlayer();
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                const progress = document.getElementById('player-progress');
                const progressDot = document.getElementById('player-progress-dot');
                const currentTimeEl = document.getElementById('player-current-time');

                if (progress) progress.style.width = percent + '%';
                if (progressDot) progressDot.style.left = percent + '%';
                if (currentTimeEl) currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        }

        function updateDuration() {
            const audio = getAudioPlayer();
            const durationEl = document.getElementById('player-duration');
            if (durationEl && audio.duration && !isNaN(audio.duration)) {
                durationEl.textContent = formatTime(audio.duration);
            }
        }

        // ============================================
        // FORMAT TIME
        // ============================================
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ============================================
        // SET VOLUME
        // ============================================
        function setVolume(value) {
            const audio = getAudioPlayer();
            volume = Math.min(100, Math.max(0, value));
            audio.volume = volume / 100;

            const volumeProgress = document.getElementById('player-volume-progress');
            if (volumeProgress) {
                volumeProgress.style.width = volume + '%';
            }

            const volumeBtn = document.getElementById('player-volume-btn');
            if (volumeBtn) {
                if (volume === 0) {
                    volumeBtn.innerHTML = '<i class="fa-solid fa-volume-mute"></i>';
                } else if (volume < 50) {
                    volumeBtn.innerHTML = '<i class="fa-solid fa-volume-low"></i>';
                } else {
                    volumeBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                }
            }
        }

        // ============================================
        // SHOW TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'info') {
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container fixed top-20 right-4 z-50 space-y-2';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            const colors = {
                'error': 'bg-red-600 text-white',
                'success': 'bg-green-600 text-white',
                'warning': 'bg-yellow-500 text-black',
                'info': 'bg-blue-600 text-white'
            };

            toast.className = `toast px-4 py-3 rounded-lg text-sm font-medium shadow-lg transition-all transform translate-x-full ${colors[type] || colors.info}`;
            toast.innerHTML = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.transform = 'translateX(0)';
            }, 10);

            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 4000);
        }

        // ============================================
        // GET CSRF TOKEN
        // ============================================
        function getCSRFToken() {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    const trimmed = cookie.trim();
                    if (trimmed.startsWith('csrftoken=')) {
                        cookieValue = decodeURIComponent(trimmed.substring(10));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // ============================================
        // EVENT LISTENERS SETUP
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎵 BayaPlus Player Initializing...');

            // Play/Pause Buttons
            const playBtn = document.getElementById('player-play');
            if (playBtn) playBtn.addEventListener('click', togglePlay);

            // Next/Previous Buttons
            const nextBtn = document.getElementById('player-next');
            const prevBtn = document.getElementById('player-prev');
            if (nextBtn) nextBtn.addEventListener('click', playNext);
            if (prevBtn) prevBtn.addEventListener('click', playPrevious);

            // Progress Bar Click
            const progressBar = document.getElementById('player-progress-bar');
            if (progressBar) {
                progressBar.addEventListener('click', function(e) {
                    const audio = getAudioPlayer();
                    if (audio.duration && !isNaN(audio.duration)) {
                        const rect = this.getBoundingClientRect();
                        const percent = (e.clientX - rect.left) / rect.width;
                        audio.currentTime = percent * audio.duration;
                    }
                });
            }

            // Volume
            const volumeBar = document.getElementById('player-volume-bar');
            if (volumeBar) {
                volumeBar.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const percent = (e.clientX - rect.left) / rect.width;
                    setVolume(percent * 100);
                });
            }

            const volumeBtn = document.getElementById('player-volume-btn');
            if (volumeBtn) {
                volumeBtn.addEventListener('click', function() {
                    const audio = getAudioPlayer();
                    if (audio.volume > 0) {
                        setVolume(0);
                    } else {
                        setVolume(70);
                    }
                });
            }

            // Shuffle
            const shuffleBtn = document.getElementById('player-shuffle');
            if (shuffleBtn) {
                shuffleBtn.addEventListener('click', function() {
                    isShuffled = !isShuffled;
                    this.style.color = isShuffled ? '#fbbf24' : '';
                    showToast(isShuffled ? 'Shuffle ON' : 'Shuffle OFF', 'info');
                });
            }

            // Repeat
            const repeatBtn = document.getElementById('player-repeat');
            if (repeatBtn) {
                repeatBtn.addEventListener('click', function() {
                    const modes = ['none', 'all', 'one'];
                    const icons = ['fa-repeat', 'fa-repeat', 'fa-repeat-1'];
                    const labels = ['Repeat OFF', 'Repeat ALL', 'Repeat ONE'];
                    const currentIdx = modes.indexOf(repeatMode);
                    const nextIdx = (currentIdx + 1) % modes.length;
                    repeatMode = modes[nextIdx];
                    this.style.color = repeatMode !== 'none' ? '#fbbf24' : '';
                    this.innerHTML = `<i class="fa-solid ${icons[nextIdx]}"></i>`;
                    showToast(labels[nextIdx], 'info');
                });
            }

            // Like
            const likeBtn = document.getElementById('player-like-btn');
            if (likeBtn) {
                likeBtn.addEventListener('click', function() {
                    const icon = this.querySelector('i');
                    if (icon.classList.contains('fa-regular')) {
                        icon.classList.remove('fa-regular');
                        icon.classList.add('fa-solid', 'text-red-500');
                        showToast('Added to likes! ❤️', 'success');
                    } else {
                        icon.classList.remove('fa-solid', 'text-red-500');
                        icon.classList.add('fa-regular');
                        showToast('Removed from likes 💔', 'info');
                    }
                });
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                }
                if (e.code === 'ArrowRight' && e.ctrlKey) {
                    e.preventDefault();
                    playNext();
                }
                if (e.code === 'ArrowLeft' && e.ctrlKey) {
                    e.preventDefault();
                    playPrevious();
                }
            });

            // Set initial volume
            setVolume(70);

            console.log('🎵 BayaPlus Player Loaded!');
            console.log('📋 Controls: Space = Play/Pause, Ctrl+Right = Next, Ctrl+Left = Previous');
            console.log('📋 30-second rule: Tracks count as streams after 30 seconds of playback');
        });
    </script>

</body>
</html>
