<!-- Music Player -->
<div id="music-player" class="fixed bottom-0 left-0 right-0 z-50 bg-[#0f0f0f] border-t border-[#1a1a1a] px-4 sm:px-6" style="display: none;">
    <footer class="h-20 flex items-center justify-between">
        <div class="flex items-center gap-3 w-1/2 sm:w-1/4 min-w-0">
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded bg-red-950 flex items-center justify-center shrink-0 overflow-hidden" id="bottom-player-cover">
                <i class="fa-solid fa-music text-red-500"></i>
            </div>
            <div class="truncate">
                <h4 class="text-xs font-bold truncate" id="bottom-player-title">No Track</h4>
                <p class="text-[10px] sm:text-[11px] text-gray-500 mt-0.5 truncate" id="bottom-player-artist">-</p>
            </div>
            <button class="text-red-500 hover:text-red-400 text-xs ml-1 sm:ml-2 shrink-0" id="player-like-btn">
                <i class="fa-regular fa-heart"></i>
            </button>
        </div>

        <div class="flex flex-col items-center gap-1 w-1/2 sm:w-2/4 max-w-xl">
            <div class="flex items-center gap-3 sm:gap-4">
                <button class="text-gray-400 hover:text-white text-xs hidden sm:block" id="player-shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button class="text-gray-400 hover:text-white text-sm" id="player-prev">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="play-btn" id="player-play">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="text-gray-400 hover:text-white text-sm" id="player-next">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="text-gray-400 hover:text-white text-xs hidden sm:block" id="player-repeat">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>
            <div class="flex items-center gap-2 w-full max-w-xs">
                <span class="text-[10px] text-gray-500" id="player-current-time">0:00</span>
                <div class="flex-1 player-progress-bar" id="player-progress-bar">
                    <div class="player-progress" id="player-progress"></div>
                    <div class="player-progress-dot" id="player-progress-dot"></div>
                </div>
                <span class="text-[10px] text-gray-500" id="player-duration">0:00</span>
            </div>
        </div>

        <div class="hidden sm:flex items-center justify-end gap-3 w-1/4">
            <button class="text-gray-400 hover:text-white text-xs" id="player-queue-btn">
                <i class="fa-solid fa-list-ul"></i>
                <span class="text-[10px] text-yellow-400" id="player-queue-count">0</span>
            </button>
            <div class="flex items-center gap-2">
                <button class="text-gray-400 hover:text-white text-xs" id="player-volume-btn">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <div class="volume-bar w-16 md:w-20 relative" id="player-volume-bar">
                    <div class="volume-progress" id="player-volume-progress"></div>
                </div>
            </div>
            <button class="text-gray-400 hover:text-white text-xs ml-1"><i class="fa-solid fa-expand"></i></button>
        </div>
    </footer>
</div>
